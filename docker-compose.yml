# Local infrastructure for VoiceForge: PostgreSQL, Redis and MinIO.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: voiceforge
      POSTGRES_USER: voiceforge
      POSTGRES_PASSWORD: voiceforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voiceforge
      MINIO_ROOT_PASSWORD: voiceforge-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
