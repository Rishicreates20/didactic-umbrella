# Local infrastructure for VoiceForge: PostgreSQL, Redis and MinIO.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: voiceforge
      POSTGRES_USER: voiceforge
      POSTGRES_PASSWORD: voiceforge
    ports:
      - "5433:5432"   # host 5433 avoids clashing with a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  # MinIO no longer publishes community images on Docker Hub (minio/minio is gone).
  # pgsty/minio ("Silo") is a maintained, drop-in fork of the MinIO server with the
  # same CLI, env vars and ports. Pinned so builds are reproducible.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voiceforge
      MINIO_ROOT_PASSWORD: voiceforge-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
