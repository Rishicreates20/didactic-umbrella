spring:
  application:
    name: voiceforge
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${VOICEFORGE_DB_URL:jdbc:postgresql://localhost:5433/voiceforge}
    username: ${VOICEFORGE_DB_USER:voiceforge}
    password: ${VOICEFORGE_DB_PASSWORD:voiceforge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${VOICEFORGE_REDIS_HOST:localhost}
      port: ${VOICEFORGE_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

voiceforge:
  chunking:
    max-chunk-chars: 250
  elevenlabs:
    base-url: https://api.elevenlabs.io
    api-key: ${ELEVENLABS_API_KEY:}
    default-model-id: eleven_multilingual_v2
    output-format: mp3_44100_128
